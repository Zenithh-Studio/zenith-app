services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-znith}
      POSTGRES_USER: ${POSTGRES_USER:-znith}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-znith-local-postgres}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-znith} -d ${POSTGRES_DB:-znith}']
      interval: 5s
      timeout: 5s
      retries: 10

  chatgpt2api:
    image: ghcr.io/zenithh-studio/chatgpt2api:v3.2.3-en.1
    restart: unless-stopped
    ports:
      - '127.0.0.1:${CHATGPT2API_PORT:-3000}:80'
    volumes:
      - chatgpt2api-runtime:/app
      - chatgpt2api-data:/app/data
      - ./chatgpt2api.config.json:/app/config.json
    environment:
      CHATGPT2API_AUTH_KEY: ${CHATGPT2API_AUTH_KEY:-${APP_CHATGPT2API_API_KEY:?Set CHATGPT2API_AUTH_KEY in .env}}
      CHATGPT2API_BASE_URL: ${CHATGPT2API_BASE_URL:-}
      CHATGPT2API_THREAD_TOKENS: ${CHATGPT2API_THREAD_TOKENS:-120}
      TZ: ${TZ:-Asia/Bangkok}
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import socket; socket.create_connection(('127.0.0.1', 80), timeout=3).close()",
        ]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  muse2api:
    image: ${MUSE2API_IMAGE:-ghcr.io/zenithh-studio/muse2api:main}
    restart: unless-stopped
    init: true
    shm_size: 1gb
    ports:
      - '127.0.0.1:${MUSE2API_PORT:-18610}:18610'
    volumes:
      - muse2api-data:/app/data
      - muse2api-auth:/run/muse2api-auth
      - muse2api-admin:/run/muse2api-admin
    environment:
      MUSE2API_HOST: 0.0.0.0
      MUSE2API_DRIVER: ${MUSE2API_DRIVER:-browser}
      MUSE2API_API_KEY: ${APP_MUSE2API_API_KEY:-${MUSE2API_API_KEY:-}}
      MUSE2API_ADMIN_KEY: ${MUSE2API_ADMIN_KEY:-}
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18610/healthz', timeout=3).read()",
        ]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 10

  app:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-http://localhost:3001}
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      chatgpt2api:
        condition: service_healthy
      muse2api:
        condition: service_healthy
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      DATABASE_URL: ${APP_DATABASE_URL:-postgresql://${POSTGRES_USER:-znith}:${POSTGRES_PASSWORD:-znith-local-postgres}@database:5432/${POSTGRES_DB:-znith}}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-}
      APP_ADMIN_SETUP_TOKEN: ${APP_ADMIN_SETUP_TOKEN:-}
      PAYLOAD_UPLOAD_DIR: /app/apps/studio/uploads
      SITE_URL: ${SITE_URL:-http://localhost:3001}
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:3001}
      APP_CHATGPT2API_BASE_URL: ${APP_CHATGPT2API_BASE_URL:-http://chatgpt2api/v1}
      APP_CHATGPT2API_API_KEY: ${CHATGPT2API_AUTH_KEY:-${APP_CHATGPT2API_API_KEY:?Set CHATGPT2API_AUTH_KEY in .env}}
      APP_MUSE2API_BASE_URL: ${APP_MUSE2API_BASE_URL:-http://muse2api:18610/v1}
      APP_MUSE2API_API_KEY: ${APP_MUSE2API_API_KEY:-${MUSE2API_API_KEY:-}}
      APP_GEMINI_API_KEY: ${APP_GEMINI_API_KEY:-}
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN:-}
      RUNWAYML_API_SECRET: ${RUNWAYML_API_SECRET:-}
    ports:
      - '${APP_PORT:-3001}:3000'
    volumes:
      - payload-uploads:/app/apps/studio/uploads
      - payload-secrets:/app/apps/studio/data
      - muse2api-auth:/run/muse2api-auth:ro
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/login').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

volumes:
  database-data:
  chatgpt2api-runtime:
  chatgpt2api-data:
  muse2api-data:
  muse2api-auth:
  muse2api-admin:
  payload-uploads:
  payload-secrets:
